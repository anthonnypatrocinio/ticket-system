<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Document</title>
</head>
<body>
    <div class="container-detalhes">
        <header class="header-ticket">
            <div class="topo">
                <h1 class="assunto">Carregando assunto...</h1>
                <span id="id-ticket">...</span>
            </div>
            <div class="satus-badge">
                <p>Status :<strong id="status">...</strong></p>
            </div>
        </header>

        <hr>

        <section class="info-grid">
            <p><strong>Solicitante:</strong><span id="usuario">...</span></p>
            <p><strong>Setor:</strong><span id="setor">...</span></p>
            <p><strong>Urgência:</strong><span id="urgência">...</span></p>
            <p><strong>Tipo:</strong><span id="tipo">...</span></p>
            <p><strong>Data:</strong><span id="data">...</span></p>
        </section>

        <hr>

        <section id="chat-container">

            <h3>Histórico de Mensagens</h3>

            <div id="lista-mensagens"></div>

            <textarea placeholder="Digite uma resposta..."></textarea>
            <button>Enviar Resposta</button>
        </section>

    </div>
</body>
</html>
